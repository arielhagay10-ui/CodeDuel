services:
  judge-runner:
    build: ./judge-worker/runner
    image: codewars-judge-runner:latest
    entrypoint: ["true"]
    network_mode: none
    read_only: true

  judge-worker:
    build: ./judge-worker
    # The orchestrator needs Docker-socket access; untrusted submissions run separately as UID 10001.
    user: "0:0"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      JUDGE_RUNNER_IMAGE: codewars-judge-runner:latest
    volumes:
      # Local MVP only. Production uses a separate, access-controlled runner host.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      judge-runner:
        condition: service_completed_successfully
