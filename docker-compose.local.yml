services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codeduel
      POSTGRES_USER: codeduel
      POSTGRES_PASSWORD: codeduel_local_only
    ports:
      - "5432:5432"
    volumes:
      - codeduel_postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeduel -d codeduel"]
      interval: 5s
      timeout: 5s
      retries: 20

  judge-runner:
    build: ./judge-worker/runner
    image: codeduel-judge-runner:latest
    entrypoint: ["true"]
    network_mode: none
    read_only: true

  judge-worker:
    build: ./judge-worker
    # The orchestrator needs Docker-socket access; untrusted submissions run separately as UID 10001.
    user: "0:0"
    environment:
      DATABASE_URL: postgresql://codeduel:codeduel_local_only@db:5432/codeduel
      JUDGE_RUNNER_IMAGE: codeduel-judge-runner:latest
    volumes:
      # Local-only bridge to launch ephemeral runner containers. Never expose externally.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      judge-runner:
        condition: service_completed_successfully

volumes:
  codeduel_postgres_data:
